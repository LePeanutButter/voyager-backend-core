# Spring Boot Configuration for Tourism Intelligent Platform
server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: always
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  application:
    name: tourism-platform
  
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tourism_platform}
    username: ${DB_USERNAME:SWNT_user}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      validation-timeout: 5000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  # Security Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  mvc:
    async:
      request-timeout: 10s
  
# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    com.tourism.platform: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"level\":\"%level\",\"logger\":\"%logger{36}\",\"thread\":\"%thread\",\"traceId\":\"%X{traceId:-}\",\"requestId\":\"%X{requestId:-}\",\"userId\":\"%X{userId:-}\",\"message\":\"%replace(%msg){'\"','\\\\\"'}\"}%n"
    file: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"level\":\"%level\",\"logger\":\"%logger{36}\",\"thread\":\"%thread\",\"traceId\":\"%X{traceId:-}\",\"requestId\":\"%X{requestId:-}\",\"userId\":\"%X{userId:-}\",\"message\":\"%replace(%msg){'\"','\\\\\"'}\"}%n"
  file:
    name: logs/tourism-platform.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# External Service Configuration
external-services:
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
    timeout: ${NOTIFICATION_SERVICE_TIMEOUT:10000}

# Application Configuration
app:
  cors:
    # Exact origins (comma-separated). Used when no origin patterns are configured.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Ant-style patterns (comma-separated), e.g. https://*.example.com — takes precedence over allowed-origins when non-empty.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Browser rule: with * origins, credentials must be false.
    allow-all-origins: ${CORS_ALLOW_ALL_ORIGINS:false}
    # Adds patterns for *.amazonaws.com and localhost (Learner Lab / ALB / S3 website) without opening all domains.
    use-aws-hostname-patterns: ${CORS_USE_AWS_HOSTNAME_PATTERNS:false}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Trace-Id,X-Request-Id
  
  file-upload:
    max-file-size: 10MB
    allowed-extensions: jpg,jpeg,png,pdf,doc,docx
  
  pagination:
    default-size: 20
    max-size: 100

# Google OAuth2 - custom config
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    scopes: ${GOOGLE_SCOPES:openid email profile}
    frontend-redirect-uri: ${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/google/callback}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.tourism.platform: DEBUG
    org.springframework.security: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Actuator on 8081 matches ALB target group health checks in voyager-infrastructure (HTTP :8081/actuator/health).
management:
  server:
    port: 8081

app:
  cors:
    # Override with CORS_USE_AWS_HOSTNAME_PATTERNS=false if the frontend is not hosted under *.amazonaws.com
    use-aws-hostname-patterns: ${CORS_USE_AWS_HOSTNAME_PATTERNS:true}

logging:
  level:
    com.tourism.platform: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
