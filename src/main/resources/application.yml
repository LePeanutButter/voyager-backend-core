# Spring Boot Configuration for Tourism Intelligent Platform
server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: tourism-platform
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/tourism_platform
    username: ${DB_USERNAME:tourism_user}
    password: ${DB_PASSWORD:tourism_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  # H2 Database (for testing)
  h2:
    console:
      enabled: false
  
  # Security Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:mySuperSecretKeyForJWTTokenGenerationThatIsAtLeast512BitsLongAndSecureEnoughForHS512AlgorithmImplementation1234567890}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  
  # Actuator Configuration
  actuator:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: when-authorized

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    com.tourism.platform: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/tourism-platform.log

# External Service Configuration
external-services:
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
    timeout: ${NOTIFICATION_SERVICE_TIMEOUT:10000}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: true
  
  file-upload:
    max-file-size: 10MB
    allowed-extensions: jpg,jpeg,png,pdf,doc,docx
  
  pagination:
    default-size: 20
    max-size: 100

# Google OAuth2 - custom config
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    scopes: ${GOOGLE_SCOPES:openid email profile}
    frontend-redirect-uri: ${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/google/callback}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.tourism.platform: DEBUG
    org.springframework.security: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/tourism_platform}
    username: ${DB_USERNAME:tourism_user}
    password: ${DB_PASSWORD:tourism_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

logging:
  level:
    com.tourism.platform: INFO
    org.springframework.security: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.tourism.platform: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
