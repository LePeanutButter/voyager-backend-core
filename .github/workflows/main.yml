# ===========================================
# GitHub Actions Workflow: CI Build & Deploy
# Environment: Production
# Description:
#   - Restores, builds, and tests the Java backend
#   - Performs static code analysis with SonarCloud
#   - Performs security scanning with Trivy
#   - Builds a Docker image and publishes a docker save tarball for manual EC2 deploy (RDS external)
#   - Runs on every push or pull request to 'main'
# ===========================================

name: CI Build & Deploy (Java Backend - Production)

# -------------------------------------------
# Trigger: Run workflow on push or PR to 'main' branch
# -------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# -------------------------------------------
# Jobs Definition
# -------------------------------------------
jobs:
  # =========================================
  # Job: Security Scan (Trivy)
  # Purpose: Scan filesystem and dependencies for vulnerabilities
  # =========================================
  trivy_scan:
    name: Run Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run Trivy filesystem scan
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # =========================================
  # Job: SonarCloud Scan
  # Purpose: Run static code analysis with SonarCloud
  # =========================================
  sonar_scan:
    name: SonarCloud Analysis (Java)
    needs: trivy_scan
    runs-on: ubuntu-latest
    steps:
    # Step 1: Checkout source code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    # Step 2: Setup Java environment
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

    # Step 3: Build and SonarCloud scan
    - name: Build and SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.scm.disabled=true \
            -Dsonar.pullrequest.key=${{ github.event.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
        else
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.scm.disabled=true \
            -Dsonar.branch.name=main \
            -Dsonar.branch.target=development
        fi

  # =========================================
  # Job: Build Stage
  # Purpose: Run tests, build Docker image, export tarball for EC2 (RDS outside container)
  # =========================================
  build:
    name: Build & Test (Java)
    needs: sonar_scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Run unit tests
      - name: Run unit tests
        run: mvn -B test

      # Step 4: Build Spring Boot package (Dockerfile multi-stage runs mvn package)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          mkdir -p release
          docker build -t voyager-backend:latest .

      - name: Save image for Learner Lab (docker load on EC2)
        run: docker save voyager-backend:latest -o release/voyager-backend-image.tar

      # Step 5: Upload image tarball for deployment
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: release/voyager-backend-image.tar

  # =========================================
  # Job: Deploy Stage (Manual)
  # Purpose: Manual deployment handoff for Learner Lab (user intervention required)
  # =========================================
  deploy_manual:
    if: github.event_name == 'push'
    name: Manual Deploy Handoff (Learner Lab)
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      BACKEND_ASG_NAME: smarttrip-backend-asg
    steps:
      - name: Checkout repository (for deploy script path)
        uses: actions/checkout@v4

      - name: Make deploy script executable
        run: chmod +x scripts/ec2-deploy-backend.sh

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image
          path: release

      - name: Publish manual deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-manual-deploy
          path: |
            release/voyager-backend-image.tar
            scripts/ec2-deploy-backend.sh
